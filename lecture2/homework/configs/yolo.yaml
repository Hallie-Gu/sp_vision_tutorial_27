#需要自行将配置文件中的相机参数补全

# 相机参数
camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

yolo_name: yolov5
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true
roi:
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false
threshold: 150

# AprilTag配置

# 检测参数
auto_charge:
  # AprilTag配置
  tag_family: "tag36h11"
  tag_size: 0.080  # m
  tag_ids: [10, 18, 24]
  corner_refinement_method: 1  # CORNER_REFINE_SUBPIX
  min_marker_perimeter_rate: 0.03
  adaptive_thresh_win_size_min: 3
  adaptive_thresh_win_size_max: 23
  adaptive_thresh_win_size_step: 10
  adaptive_thresh_constant: 7.0
  